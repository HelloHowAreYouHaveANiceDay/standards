name: release-tags
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-tags
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags origin
      - run: bash .github/scripts/release-tags.sh
